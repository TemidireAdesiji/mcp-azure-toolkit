[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-azure-toolkit"
version = "0.1.1"
description = "An MCP server exposing Azure services (Blob, Key Vault, Service Bus, Resources) as AI tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "azure", "ai", "copilot", "tools"]
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.0",
    "azure-identity>=1.16",
]

[project.optional-dependencies]
# Azure SDKs are optional so the package (and its tests against fakes) installs lean.
azure = [
    "azure-storage-blob>=12.19",
    "azure-keyvault-secrets>=4.8",
    "azure-servicebus>=7.12",
    "azure-mgmt-resource>=23.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
mcp-azure-toolkit = "mcp_azure_toolkit.server:main"

[tool.setuptools]
packages = ["mcp_azure_toolkit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mcp_azure_toolkit --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
